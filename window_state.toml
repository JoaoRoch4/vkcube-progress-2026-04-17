# vkcube persisted UI state (auto-generated). Manual edits are allowed.
# Cube animation toggle (true = auto rotate, false = manual drag only).
# Auto-rotate cube each frame when true.
cube_auto_spin = true
# Show the 'Another Window' sample panel.
show_another_window = false
# Window toggles persisted between runs.
# Show embedded Controls section inside Hello, world! window.
show_controls = true
# Show Copilot chat/testing window.
show_copilot = true
# Cube background visibility (false uses clear_color as scene background).
# Show cube in Vulkan background.
show_cube = true
# Show debug log mirror window.
show_debug_log_mirror_window = true
# Show Dear ImGui demo window.
show_demo_window = true
# Show emoji atlas preview window.
show_emoji_atlas_window = true
# Show hot-reload module UI window.
show_hot_module = true
# Show Style Editor window.
show_style_editor_window = false
# Show terminals window.
show_terminal_window = true
# Show imgui_test_engine control window.
show_test_engine_window = true

